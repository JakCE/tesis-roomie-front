<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium min-w-64 max-w-sm transition-all"
      [class]="t.type === 'success' ? 'bg-green-500 text-white' :
               t.type === 'error'   ? 'bg-red-500 text-white' :
                                      'bg-gray-800 text-white'"
    >
      <span class="text-base">
        {{ t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ' }}
      </span>
      <span class="flex-1">{{ t.message }}</span>
      <button
        (click)="toast.dismiss(t.id)"
        class="opacity-70 hover:opacity-100 text-lg leading-none"
      >×</button>
    </div>
  }
</div>
