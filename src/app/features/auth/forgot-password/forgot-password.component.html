<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-md p-8">

    <h1 class="text-2xl font-bold text-gray-900 mb-1">Recuperar contraseña</h1>
    <p class="text-sm text-gray-400 mb-6">Ingresa tu correo y la nueva contraseña</p>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="tu@email.com"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
      <input
        type="password"
        [(ngModel)]="newPassword"
        placeholder="••••••••"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        placeholder="••••••••"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
      />
    </div>

    @if (error()) {
      <p class="text-red-500 text-sm mb-3">{{ error() }}</p>
    }

    <button
      (click)="onSubmit()"
      [disabled]="isLoading()"
      class="w-full py-3 bg-violet-600 hover:bg-violet-700 disabled:opacity-60 text-white font-medium rounded-xl text-sm transition-colors"
    >
      {{ isLoading() ? 'Actualizando...' : 'Actualizar contraseña' }}
    </button>

    <p class="text-center text-sm text-gray-500 mt-4">
      <a routerLink="/login" class="text-violet-600 font-medium hover:underline">Volver a iniciar sesión</a>
    </p>

  </div>
</div>
